name: بناء تطبيق الأندرويد APK تلقائياً

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: بناء ملف APK للأندرويد
    runs-on: ubuntu-latest

    steps:
      - name: سحب كود المشروع (Checkout Code)
        uses: actions/checkout@v4

      - name: إعداد بيئة Node.js (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: تثبيت الاعتمادات (Install Dependencies)
        run: npm ci

      - name: بناء تطبيق الويب (Build Web Assets)
        run: npm run build

      - name: إعداد بيئة جافا (Setup Java JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: تثبيت أدوات Capacitor وإضافة منصة الأندرويد
        run: |
          npx cap init "الرقية الشرعية - سعد الغامدي" "com.ruqyah.saadalghamdi" --web-dir "dist" || true
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: بناء ملف APK عبر Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع ملف APK كـ Artifact مجاناً
        uses: actions/upload-artifact@v4
        with:
          name: Ruqyah-Saad-AlGhamdi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
