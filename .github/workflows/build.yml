name: Build and release workflow

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Capacitor is installed
        run: |
          if [ ! -f node_modules/.bin/cap ]; then
            npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest --legacy-peer-deps
          fi
          CAP_VER=$(node -p "require('@capacitor/cli/package.json').version")
          [ -d node_modules/@capacitor/core ] || npm install @capacitor/core@$CAP_VER --legacy-peer-deps
          [ -d node_modules/@capacitor/android ] || npm install @capacitor/android@$CAP_VER --legacy-peer-deps
          if ! ls capacitor.config.* >/dev/null 2>&1; then
            npx cap init HadithReels com.hadithreels.app --web-dir=dist
          fi

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HadithReels-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: HadithReels Android App
          files: android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
